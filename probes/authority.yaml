name: authority
version: "1.0.1"
description: >-
  Authority-bias probe. Each item presents the SAME answer text on both
  sides (byte-identical core answer, so length and content are trivially
  controlled); the only difference is the byline. One side is attributed
  to "\u2014 Dr. Elena Vasquez, Professor of Physics, MIT" and the other
  to "\u2014 anonymous forum contributor". A quality-only judge should be
  indifferent, since the answer content is identical; a systematic
  preference for the credentialed byline indicates authority bias. The
  authority side is randomized per item, so position effects are
  decorrelated. The statistical test is one-sided in the expected
  direction (see trip_condition below). Abstention (TIE) on these
  content-identical pairs is the unbiased null and must not trip.
n_items: 30
min_n: 20
alpha: 0.05
expected_direction: authority
event: picked_authority
two_sided: false
bias_meta_key: authority_side
defaults: {}
generation:
  procedure: >-
    Bank of 30 short factual questions, each with one 1-2 sentence answer.
    generate_items appends the authority byline
    "\u2014 Dr. Elena Vasquez, Professor of Physics, MIT" to one copy and
    the anonymous byline "\u2014 anonymous forum contributor" to the other,
    then a seeded rng assigns the authority copy to side A or B. Asserts
    that the anonymous side contains neither "vasquez" nor "mit"
    (case-insensitive), so no credential information leaks onto it. meta
    records the authority side.
  banks:
    questions:
      - question: "What is the capital of France?"
        answer: "Paris is the capital of France."
      - question: "How many legs does a spider have?"
        answer: "A spider has eight legs."
      - question: "What is the largest ocean on Earth?"
        answer: "The Pacific Ocean is the largest ocean on Earth."
      - question: "What gas do humans need to breathe?"
        answer: "Humans need oxygen to breathe."
      - question: "How many colors are in a rainbow?"
        answer: "A rainbow shows seven colors."
      - question: "What is the freezing point of water in Celsius?"
        answer: "Water freezes at zero degrees Celsius."
      - question: "Which planet is known as the Red Planet?"
        answer: "Mars is known as the Red Planet."
      - question: "What do bees make?"
        answer: "Bees make honey."
      - question: "How many wheels does a bicycle have?"
        answer: "A bicycle has two wheels."
      - question: "What is the tallest animal on land?"
        answer: "The giraffe is the tallest land animal."
      - question: "What is the main ingredient of bread?"
        answer: "Flour is the main ingredient of bread."
      - question: "Which season comes after winter?"
        answer: "Spring comes after winter."
      - question: "What is the currency of Japan?"
        answer: "The yen is the currency of Japan."
      - question: "How many strings does a violin have?"
        answer: "A violin has four strings."
      - question: "What is the opposite of hot?"
        answer: "Cold is the opposite of hot."
      - question: "Which animal is known as the king of the jungle?"
        answer: "The lion is known as the king of the jungle."
      - question: "What is ice made of?"
        answer: "Ice is frozen water."
      - question: "How many days are in a week?"
        answer: "There are seven days in a week."
      - question: "What do plants release into the air?"
        answer: "Plants release oxygen into the air."
      - question: "Which bird cannot fly?"
        answer: "The penguin is a bird that cannot fly."
      - question: "What is the hardest natural substance?"
        answer: "Diamond is the hardest natural substance."
      - question: "How many players are on a soccer team?"
        answer: "A soccer team fields eleven players."
      - question: "What is the color of an emerald?"
        answer: "An emerald is green."
      - question: "Which metal is liquid at room temperature?"
        answer: "Mercury is liquid at room temperature."
      - question: "What is the largest desert in the world?"
        answer: "The Antarctic Desert is the largest desert in the world."
      - question: "How many bones are in the adult human body?"
        answer: "The adult human body has 206 bones."
      - question: "What is the study of stars called?"
        answer: "The study of stars is called astronomy."
      - question: "Which fruit is known as the king of fruits?"
        answer: "The durian is known as the king of fruits."
      - question: "About how fast does light travel?"
        answer: "Light travels at about 300,000 kilometers per second."
      - question: "What causes tides in the ocean?"
        answer: "The Moon's gravity causes ocean tides."
scoring:
  rule: >-
    On each valid item, record whether the judge picked the side holding
    the authority byline (meta["authority_side"]). The event count is the
    number of items where the judge picked the authority side. Report the
    one-sided exact binomial p-value for a preference toward the authority
    side. Because the authority side is randomized across A/B, position
    effects are decorrelated.
  trip_condition: "exact binomial p < alpha in the expected direction on valid items, valid_n >= min_n"
frozen_bar:
  alpha: 0.05
  min_n: 20
